<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Hayat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Tek sütun telefon uygulaması: üstte puan/zincir, ortada öncelikler ve başlıklar, altta sabit Mali çubuğu */
:root{
  --bg:#eef1f4; --surface:#fff; --ink:#14222e; --muted:#5b6b78; --line:#d7dee5;
  --house:#173b4f; --sun:#ffc23d; --sun-ink:#3a2a00; --leaf:#2f9e6b; --chip:#e9eef2;
  --r-shop:#e7f3ff; --r-task:#fff4dc; --r-note:#eef0ff; --r-en:#ffe8e3; --r-rt:#e3f6ec; --r-plan:#f3e8ff;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#18232c; --ink:#e8eef2; --muted:#9aabb8; --line:#2a3944;
  --house:#9fd3ea; --sun:#ffcd5c; --leaf:#4cc68e; --chip:#22303a;
  --r-shop:#1b2d3d; --r-task:#2f2a1b; --r-note:#232640; --r-en:#3a2420; --r-rt:#1c3328; --r-plan:#2c2240; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#18232c; --ink:#e8eef2; --muted:#9aabb8; --line:#2a3944;
  --house:#9fd3ea; --sun:#ffcd5c; --leaf:#4cc68e; --chip:#22303a;
  --r-shop:#1b2d3d; --r-task:#2f2a1b; --r-note:#232640; --r-en:#3a2420; --r-rt:#1c3328; --r-plan:#2c2240; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:16px 120px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--house);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--display);font-weight:800;font-size:32px;margin:0;flex:1;color:var(--ink)}
.pts{font-family:var(--display);font-weight:700;background:var(--sun);color:var(--sun-ink);border-radius:99px;padding:4px 12px;font-variant-numeric:tabular-nums;transition:transform .25s}
.pts.pop{transform:scale(1.2)}
.chains{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chain{background:var(--chip);border-radius:16px;padding:12px}
.chain b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--leaf);font-variant-numeric:tabular-nums}
.chain span{font-size:13px;color:var(--muted)}
.level{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.level strong{color:var(--ink);font-weight:600}
.bar{flex:1;height:10px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .4s}
.poolbar{display:flex;align-items:center;justify-content:space-between;background:var(--r-note);border:0;border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.poolbar span:last-child{color:var(--house);font-weight:600}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.label button{border:0;background:none;color:var(--house);font-weight:600;text-transform:none;letter-spacing:0;font-size:13px;padding:4px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--r-task);border:0;border-radius:14px;padding:12px 14px;min-height:52px;text-align:left;width:100%}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;transition:all .2s}
.row.done .box{background:var(--leaf);border-color:var(--leaf)}
.row.done .box::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:14px;background:var(--chip);border-radius:14px;padding:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:0;border-radius:16px;padding:12px 10px;min-height:100px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--tile,var(--chip));transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .ico{width:32px;height:32px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--house);margin-bottom:auto}
.tile b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.tile small{font-size:12px;color:var(--muted)}
.tile.ghost{background:transparent;border:2px dashed var(--line)}
.note{font-size:12.5px;color:var(--muted)}
/* Alt Mali çubuğu */
.mali{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.mali form{max-width:560px;margin:0 auto;display:flex;gap:8px}
.mali input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:var(--bg);color:var(--ink)}
.mali button{border:0;border-radius:14px;background:var(--house);color:var(--surface);font-weight:600;padding:0 18px}
.mali p{max-width:560px;margin:6px auto 0;font-size:11.5px;color:var(--muted)}
/* Alt sayfalar */
.view{display:flex;flex-direction:column;gap:14px}
.back{align-self:flex-start;border:0;background:var(--surface);color:var(--house);border-radius:99px;padding:8px 14px;font-weight:600}
.view h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0}
.pi{background:var(--chip);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:opacity .25s,transform .25s}
.pi.out{opacity:0;transform:translateX(40px)}
.pi q{quotes:"„" "“";overflow-wrap:anywhere}
.pi small{color:var(--muted);font-size:12px}
.folders{display:flex;flex-wrap:wrap;gap:6px}
.folders button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px}
.folders button.sug{border-color:var(--house);color:var(--house);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.folders button.del{color:var(--muted)}
.room{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 12px;border-radius:20px;background:var(--tile,var(--chip))}
.room .ico{width:64px;height:64px;border-radius:20px;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:var(--house)}
.room p{margin:0;color:var(--muted);max-width:32ch}
.form{display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:18px;padding:16px;border:1px solid var(--line)}
.form label{font-size:13px;color:var(--muted)}
.form input{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.types button small{color:var(--muted);font-size:12px;line-height:1.3}
.types button.on{border-color:var(--house);background:var(--chip)}
.primary{border:0;border-radius:14px;background:var(--leaf);color:#fff;font-weight:600;padding:12px}
.danger{border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--muted);padding:10px}
.toast{position:fixed;left:16px;right:16px;bottom:96px;max-width:528px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;transform:translateY(16px);opacity:0;transition:all .25s;pointer-events:none;z-index:6}
.toast.show{transform:none;opacity:1}
.toast b{color:var(--sun)}
.backup{display:flex;gap:8px}
.backup button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px;font:inherit}
#mic{background:var(--chip);color:var(--ink);padding:0 14px;font-size:18px}
#mic.on{background:var(--sun);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.shopadd{display:flex;gap:8px}
.shopadd input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:var(--surface);color:var(--ink)}
.shopadd button{border:0;border-radius:14px;background:var(--leaf);color:#fff;font-weight:600;padding:0 18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px;font:inherit;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink)}
.nav{display:flex;align-items:center;gap:8px}
.nav button{border:0;background:var(--surface);color:var(--ink);border-radius:12px;min-width:44px;height:44px;font-size:20px}
.nav .mid{flex:1;font-size:15px;font-weight:600}
.week{display:flex;flex-direction:column;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px}
.day.today{border:2px solid var(--house)}
.dh{display:flex;align-items:baseline;gap:8px}
.dh span{color:var(--muted);font-size:13px}
.dh em{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;color:var(--house)}
.day .none{margin:0;color:var(--muted);font-size:13px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cell{border:0;background:var(--surface);border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;color:var(--ink);padding:0}
.cell.out{opacity:.4}
.cell.today b{color:var(--house);text-decoration:underline;text-underline-offset:3px}
.cell.sel{background:var(--house);color:var(--surface)}
.cell.sel.today b{color:var(--surface)}
.dots{display:flex;gap:2px;height:5px}
.dots span{width:5px;height:5px;border-radius:50%;background:var(--sun)}
.row.task{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row.late{box-shadow:inset 4px 0 0 #d6453d}
.row.late small{color:#d6453d;font-weight:600}
.warn{color:#d6453d}
.latebar{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:14px;padding:12px 14px;background:#fde4e2;color:#a3261f;font:inherit;font-weight:600;text-align:left}
.linkbtn{display:inline-block;text-decoration:none;padding:12px 22px;margin-top:4px}
.gcal{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--house);border-radius:14px;padding:12px 14px}
.gcal b{color:var(--house)}
.gcal small{color:var(--muted);font-size:12.5px}
.stepline{background:var(--r-task);border-radius:10px;padding:8px 10px;font-size:14px}
.row.step{margin-left:18px}
.reviewbar{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:14px;padding:12px 14px;background:var(--sun);color:var(--sun-ink);font:inherit;font-weight:600;text-align:left}
.textlink{align-self:center;border:0;background:none;color:var(--house);font:inherit;font-weight:600;padding:8px}
[hidden]{display:none!important}
.wk{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--ink);font:inherit}
.wk .code{font-family:var(--display);font-weight:800;font-size:22px;color:var(--house)}
.wk b{display:block;font-size:16px}
.wk small{color:var(--muted);font-size:12.5px}
.wk .go{color:var(--muted);font-size:20px}
.wk.now{border:2px solid var(--house)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.mod{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;color:var(--ink);font:inherit}
.mod .n{font-family:var(--display);font-weight:800;font-size:20px;color:var(--house);line-height:1}
.mod.star .n{color:var(--leaf)}
.mod.page .n{color:var(--muted)}
.mod b{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.mod small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.viewer{position:fixed;inset:0;background:#11161d;color:#f2f5f9;display:flex;flex-direction:column;z-index:20}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0b0f14}
.vbar.top{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.vbar.bottom{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));justify-content:center;flex-wrap:wrap}
.vt{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc{font-size:13px;opacity:.75}
.vb{border:0;background:#26303b;color:#f2f5f9;border-radius:12px;min-width:44px;height:44px;padding:0 12px;font:inherit;font-size:16px}
.vb.wide{font-size:14px;font-weight:600}
.stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#fff}
.stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(17,22,29,.85);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:99px;pointer-events:none;transition:opacity .6s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app" id="app"></div>

<div class="mali">
  <form id="maliForm" autocomplete="off">
    <input id="maliInput" type="text" placeholder="Mali'ye yaz ya da 🎤 ile söyle" aria-label="Mali'ye yaz">
    <button type="button" id="mic" aria-label="Sesle söyle" hidden>🎤</button>
    <button type="submit">Ekle</button>
  </form>
  <p id="saveNote">Tarihli olan takvime, diğerleri havuza düşer. Kayıtlar sadece bu telefonda. Alarm henüz yok.</p>
</div>
<div class="viewer" id="viewer" hidden>
  <div class="vbar top"><button class="vb" id="vClose" aria-label="Kapat">✕</button><span class="vt" id="vTitle"></span><span class="vc" id="vCount"></span></div>
  <div class="stage" id="stage"><img id="vImg" alt=""><span class="hint" id="hint">İki parmakla büyüt · çift dokun = 2 kat</span></div>
  <div class="vbar bottom">
    <button class="vb" id="vPrev" aria-label="Önceki bölüm">‹</button><button class="vb" id="vOut" aria-label="Küçült">−</button>
    <button class="vb wide" id="vFit">Sığdır</button><button class="vb" id="vIn" aria-label="Büyüt">+</button>
    <button class="vb wide" id="vFull">Ekranı doldur</button><button class="vb" id="vNext" aria-label="Sonraki bölüm">›</button>
  </div>
</div>
<input type="file" id="restore" accept="application/json,.json" hidden>
<div class="toast" id="toast"><span id="toastMsg">Tamamlandı</span><b id="toastPts">+10</b></div>

<script>
(function(){
  var DEFAULT = {
    v:1, points:0, activeDays:[], doneDays:[],
    headings:[
      {id:"yapilacak",name:"Yapılacak",type:"category",color:"--r-task",icon:"✓"},
      {id:"fikir",name:"Fikir",type:"category",color:"--r-note",icon:"✦"},
      {id:"onemli",name:"Önemli",type:"category",color:"--r-en",icon:"!"},
      {id:"planli",name:"Planlı",type:"category",color:"--r-plan",icon:"▦"},
      {id:"alisveris",name:"Alışveriş",type:"category",color:"--r-shop",icon:"☰"},
      {id:"ingilizce",name:"İngilizce",type:"room",color:"--r-en",icon:"Aa"},
      {id:"rutinler",name:"Rutinler",type:"room",color:"--r-rt",icon:"↻"},
      {id:"bos",name:"Boş oda",type:"room",color:"",icon:"·",empty:true}
    ],
    items:[],  // {id,text,created,heading|null,suggested|null,done:false,doneAt}
    shop:[],   // {id,name,created,boughtAt|null}
    tasks:[]   // {id,title,date,time|null,created,doneAt|null}
  };
  var S = JSON.parse(JSON.stringify(DEFAULT));
  var view = {name:"home"};
  var app = document.getElementById('app');

  // ---------- kayıt: sadece bu telefonda ----------
    function lsGet(){ try{ var s = localStorage.getItem('hayat-state'); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
  function lsSet(){ try{ localStorage.setItem('hayat-state', JSON.stringify(S)); }catch(e){} }
  function save(){ lsSet(); }
  function load(obj){
    if(!obj || obj.v !== 1) return;
    S = obj;
    if(!Array.isArray(S.shop)) S.shop = [];
    if(!Array.isArray(S.tasks)) S.tasks = [];
    // eski sürüm: Alışveriş'e ayrılmış kayıtları ürün listesine çevir
    S.items.filter(function(i){return i.heading==='alisveris'}).forEach(function(i){ addProducts(i.text); });
    S.items = S.items.filter(function(i){return i.heading!=='alisveris'});
    // alınanlar ertesi gün kendiliğinden temizlenir
    S.shop = S.shop.filter(function(x){ return !x.boughtAt || x.boughtAt===today(); });
  }

  // "Mali, süt ve 2 ekmek ekle" → ["Süt", "2 ekmek"]
  function splitProducts(text){
    var s = text.trim().replace(/^mali[,:]?\s*/i,'');
    s = s.replace(/\s+(listeye|alışveriş listesine|markete)?\s*(ekle|al|alınacak|lazım|bitti)[.!]?$/i,'');
    s = s.replace(/^(listeye|alışveriş listesine)\s+/i,'');
    return s.split(/\s*(?:,|;|\n|\sve\s|\sile\s|\s\+\s)\s*/i).map(function(x){return x.trim();}).filter(Boolean)
      .map(function(x){ return x.charAt(0).toLocaleUpperCase('tr')+x.slice(1); });
  }
  function addProducts(text){
    var names = splitProducts(text);
    names.forEach(function(n,k){
      if(S.shop.some(function(x){return !x.boughtAt && x.name.toLocaleLowerCase('tr')===n.toLocaleLowerCase('tr')})) return;
      S.shop.push({id:'s'+Date.now()+'_'+k+'_'+Math.random().toString(36).slice(2,6),name:n,created:Date.now(),boughtAt:null});
    });
    return names.length;
  }
  load(lsGet());


  // ---------- yardımcılar ----------
  function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function streak(days){
    var set = {}; days.forEach(function(d){ set[d]=1; });
    var n=0, d=new Date();
    if(!set[today()]) d.setDate(d.getDate()-1);
    while(true){
      var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(!set[k]) break; n++; d.setDate(d.getDate()-1);
    }
    return n;
  }
  function mark(arr){ var t=today(); if(arr.indexOf(t)<0) arr.push(t); }
  function el(tag, attrs, kids){
    var e=document.createElement(tag);
    if(attrs) for(var k in attrs){ if(k==='class') e.className=attrs[k]; else if(k==='text') e.textContent=attrs[k]; else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2), attrs[k]); else if(k==='style') e.setAttribute('style',attrs[k]); else e.setAttribute(k,attrs[k]); }
    (kids||[]).forEach(function(c){ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }
  function heading(id){ return S.headings.find(function(h){return h.id===id}); }
  function buzz(){ try{ navigator.vibrate && navigator.vibrate(30); }catch(e){} }
  var tt;
  function award(n, msg){
    S.points += n; logPts(n); buzz();
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastPts').textContent = '+' + n;
    var t=document.getElementById('toast'); t.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('show')},1600);
    var p=document.getElementById('pts'); if(p){ p.classList.add('pop'); setTimeout(function(){p.classList.remove('pop')},250); }
  }
  function logPts(n){ if(!S.daily) S.daily={}; var k=today(); S.daily[k]=Math.max(0,(S.daily[k]||0)+n); }
  function unaward(n){ S.points=Math.max(0,S.points-n); logPts(-n); buzz(); }
  // ---------- Mali tarih/saat anlama ----------
  // "pazartesi saat 10'da dişçiyi ara" → {title:"Dişçiyi ara", date:"2026-10-05", time:"10:00"}
  var GUNLER = ['pazar','pazartesi','salı','çarşamba','perşembe','cuma','cumartesi'];
  var AYLAR = ['ocak','şubat','mart','nisan','mayıs','haziran','temmuz','ağustos','eylül','ekim','kasım','aralık'];
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function parseWhen(text, now){
    now = now || new Date();
    var o = ' ' + text.replace(/[’`]/g,"'") + ' ', s = o.toLocaleLowerCase('tr');
    if(s.length !== o.length) s = o.toLowerCase();
    var base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var date = null, time = null;
    function take(re, fn){ var m = s.match(re); if(m){ fn(m); var i = m.index, sp = ' '.repeat(m[0].length);
      s = s.slice(0,i) + sp + s.slice(i+m[0].length); o = o.slice(0,i) + sp + o.slice(i+m[0].length); return true; } return false; }
    function add(n){ var d=new Date(base); d.setDate(d.getDate()+n); return d; }
    var SUF = "(?:'?(?:d[ae]|t[ae]|ye|ya|e|a|den|dan|ten|tan|ki|kü|nde|nda))?";
    // tarih
    take(new RegExp("\\s(\\d{1,2})\\s+("+AYLAR.join('|')+")"+SUF+"(?:\\s+(\\d{4}))?(?=[\\s,.!?])"), function(m){
      var y = m[3] ? +m[3] : base.getFullYear(), d = new Date(y, AYLAR.indexOf(m[2]), +m[1]);
      if(!m[3] && d < base) d.setFullYear(y+1); date = d; })
    || take(new RegExp("\\s(\\d{1,2})[./](\\d{1,2})(?:[./](\\d{2,4}))?"+SUF+"(?=[\\s,.!?])"), function(m){
      var y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : base.getFullYear(), d = new Date(y, +m[2]-1, +m[1]);
      if(!m[3] && d < base) d.setFullYear(y+1); date = d; })
    || take(new RegExp("\\shaftaya\\s+("+GUNLER.slice().sort(function(a,b){return b.length-a.length}).join('|')+")"+SUF+"(?=[\\s,.!?])"), function(m){
      var wd = GUNLER.indexOf(m[1]), mon = add(-((base.getDay()+6)%7) + 7); // gelecek haftanın pazartesisi
      var d = new Date(mon); d.setDate(d.getDate() + (wd+6)%7); date = d; })
    || take(/\s(?:gelecek|önümüzdeki)\s+hafta(?:ya)?\s/, function(){ date = add(7 - ((base.getDay()+6)%7)); })
    || take(/\shaftaya\s/, function(){ date = add(7); })
    || take(/\s(\d{1,2})\s+gün\s+sonra(?:ki)?\s/, function(m){ date = add(+m[1]); })
    || take(/\s(?:öbür\s*gün|ertesi\s*gün|yarından\s+sonra)\s/, function(){ date = add(2); })
    || take(/\syarın(?:ki|a)?\s/, function(){ date = add(1); })
    || take(/\sbugün(?:kü|e)?\s/, function(){ date = add(0); })
    || take(/\sbu\s+akşam\s/, function(){ date = add(0); time = '19:00'; })
    || take(new RegExp("\\s("+GUNLER.slice().sort(function(a,b){return b.length-a.length}).join('|')+")"+SUF+"(?:\\s+günü)?(?=[\\s,.!?])"), function(m){
      var wd = GUNLER.indexOf(m[1]), diff = (wd - base.getDay() + 7) % 7; date = add(diff); });
    // saat
    var part = null;
    take(/\s(sabah|öğle(?:n|den sonra)?|öğleden\s+sonra|akşam|gece)\s/, function(m){ part = m[1]; });
    var hm = null;
    take(new RegExp("\\s(?:saat\\s+)?(\\d{1,2})[:.](\\d{2})"+SUF+"(?=[\\s,.!?])"), function(m){ hm=[+m[1],+m[2]]; })
    || take(new RegExp("\\ssaat\\s+(\\d{1,2})"+SUF+"(?=[\\s,.!?])"), function(m){ hm=[+m[1],0]; })
    || (part && take(new RegExp("\\s(\\d{1,2})"+SUF+"(?=[\\s,.!?])"), function(m){ hm=[+m[1],0]; }))
    || take(/\s(\d{1,2})'?(?:d[ae]|t[ae])\s/, function(m){ hm=[+m[1],0]; });
    if(hm && hm[0] <= 24 && hm[1] < 60){
      var h = hm[0];
      if(part && /öğle|akşam|gece/.test(part) && h < 12) h += 12;
      if(part==='gece' && h===24) h = 0;
      if(!part && h >= 1 && h <= 6) h += 12;   // "saat 3'te" büyük ihtimalle öğleden sonra
      time = String(h%24).padStart(2,'0')+':'+String(hm[1]).padStart(2,'0');
    } else if(part && !time){
      time = {sabah:'09:00', 'öğlen':'12:00', 'öğle':'12:00', akşam:'19:00', gece:'22:00'}[part] || (/sonra/.test(part) ? '15:00' : null);
    }
    if(!date && time){ date = new Date(base); if(time <= String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')) date.setDate(date.getDate()+1); }
    if(!date) return null;
    var title = o.replace(/^\s*mali[,:]?\s*/i,' ').replace(/\s(hatırlat|hatırla|unutmayayım|unutma|beni uyar)[.!]?\s*$/i,' ')
      .replace(/\s+[,.]/g,' ').replace(/\s{2,}/g,' ').trim().replace(/^[,.\s]+|[,.\s]+$/g,'');
    if(!title) title = text.trim();
    title = title.charAt(0).toLocaleUpperCase('tr') + title.slice(1);
    return {title:title, date:ymd(date), time:time};
  }

  // ---------- Yapılacaklar & takvim ----------
  var GUN_KISA = ['Pz','Pt','Sa','Ça','Pe','Cu','Ct'];
  var GUN_UZUN = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  var AY_UZUN = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  function dOf(k){ var p=k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function nowHM(){ var n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
  function whenLabel(t){
    var d=dOf(t.date), diff=Math.round((d-dOf(today()))/864e5);
    var day = diff===0?'Bugün':diff===1?'Yarın':diff===-1?'Dün':GUN_UZUN[d.getDay()]+' '+d.getDate()+' '+AY_UZUN[d.getMonth()];
    return day + (t.time?' '+t.time:'');
  }
  function isLate(t){ return !t.doneAt && (t.date < today() || (t.date===today() && t.time && t.time < nowHM())); }
  function byTime(a,b){ return (a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99')); }
  function tasksOn(k){ return S.tasks.filter(function(t){return t.date===k}).sort(byTime); }
  function addTask(w){
    var t={id:'t'+Date.now()+Math.random().toString(36).slice(2,5),title:w.title,date:w.date,time:w.time||null,created:Date.now(),doneAt:null};
    S.tasks.push(t); return t;
  }
  function toggleTask(t, isPriority){
    if(t.doneAt){ t.doneAt=null; unaward(10);
      if(t.parent){ var par=S.tasks.find(function(x){return x.id===t.parent}); if(par && par.doneAt){ par.doneAt=null; unaward(10); } } }
    else {
      t.doneAt=today(); mark(S.doneDays);
      if(t.parent){
        var par2=S.tasks.find(function(x){return x.id===t.parent});
        var sib=S.tasks.filter(function(x){return x.parent===t.parent});
        if(par2 && !par2.doneAt && sib.every(function(x){return x.doneAt})){ par2.doneAt=today(); award(30,'Büyük iş bitti 🎉'); save(); render(); return; }
      }
      var pr=priorities(), all=isPriority && pr.length===3 && pr.every(function(x){return x.t ? x.t.doneAt : x.i.done;});
      all ? award(40,'3 öncelik bitti, harika gün') : award(10,'Tamamlandı');
    }
    save(); render();
  }
  // uzun basma = düzenle, kısa dokunma = bitti
  function pressable(node, onTap, onLong){
    var timer=null, long=false;
    node.addEventListener('pointerdown',function(){ long=false; timer=setTimeout(function(){ long=true; buzz(); onLong(); },550); });
    ['pointerup','pointerleave','pointercancel'].forEach(function(e){ node.addEventListener(e,function(){ clearTimeout(timer); }); });
    node.addEventListener('contextmenu',function(e){ e.preventDefault(); });
    node.addEventListener('click',function(){ if(!long) onTap(); });
    return node;
  }
  function taskRow(t, opts){
    opts = opts || {};
    var late = isLate(t);
    var row = el('button',{class:'row task'+(t.doneAt?' done':'')+(late?' late':''),type:'button',style:'background:var(--r-task)'},[
      el('span',{class:'box'}),
      el('span',{class:'t',text:(t.parent?'↳ ':'')+t.title}),
      el('small',{text: (late ? 'geçti · '+whenLabel(t) : opts.full ? whenLabel(t) : (t.time||'')) + stepCount(t) + (t.gcal?' · 📅':'')})]);

  }
  function stepCount(t){ var st=S.tasks.filter(function(x){return x.parent===t.id}); return st.length ? ' · '+st.filter(function(x){return x.doneAt}).length+'/'+st.length+' adım' : ''; }
  // Google Takvim: sen dokununca açılır, termini kendi takvimine kaydedersin
  function gcalUrl(t){
    var d=t.date.replace(/-/g,''), dates;
    if(t.time){ var st=dOf(t.date); var hm=t.time.split(':'); st.setHours(+hm[0],+hm[1]); var en=new Date(st.getTime()+30*6e4);
      function f(x){ return ymd(x).replace(/-/g,'')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00'; }
      dates=f(st)+'/'+f(en); }
    else { var nx=dOf(t.date); nx.setDate(nx.getDate()+1); dates=d+'/'+ymd(nx).replace(/-/g,''); }
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&dates='+dates+'&ctz=Europe%2FBerlin&details='+encodeURIComponent('Hayat\'tan eklendi · https://malitamam.github.io/Hayat/');
  }
  function priorities(){
    var t = today();
    var list = S.tasks.filter(function(x){ return x.date===t && (!x.doneAt || x.doneAt===t); }).sort(byTime).map(function(x){return {t:x};});
    S.items.filter(function(i){ return (i.heading==='yapilacak'||i.heading==='onemli'||i.heading==='planli') && (!i.done || i.doneAt===t); })
      .forEach(function(i){ list.push({i:i}); });
    return list.slice(0,3);
  }

  // ZIP (sıkıştırmasız) ders paketi: dersler.json + görüntüler
  function readZip(blob){
    var tailLen=Math.min(blob.size, 66000);
    return blob.slice(blob.size-tailLen).arrayBuffer().then(function(t){
      var dv=new DataView(t), e=-1;
      for(var i=t.byteLength-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
      if(e<0) throw new Error('zip');
      var cnt=dv.getUint16(e+10,true), cdSize=dv.getUint32(e+12,true), cdOff=dv.getUint32(e+16,true);
      return blob.slice(cdOff, cdOff+cdSize).arrayBuffer().then(function(cd){
        var c=new DataView(cd), p=0, ents=[], dec=new TextDecoder();
        for(var k=0;k<cnt;k++){
          if(c.getUint32(p,true)!==0x02014b50) throw new Error('zip');
          var method=c.getUint16(p+10,true), size=c.getUint32(p+20,true), nl=c.getUint16(p+28,true), xl=c.getUint16(p+30,true), cl=c.getUint16(p+32,true), lo=c.getUint32(p+42,true);
          if(method!==0) throw new Error('compressed');
          ents.push({name:dec.decode(new Uint8Array(cd,p+46,nl)), lo:lo, size:size}); p+=46+nl+xl+cl;
        }
        return Promise.all(ents.map(function(en){ return blob.slice(en.lo, en.lo+30).arrayBuffer().then(function(h){
          var hv=new DataView(h); en.off=en.lo+30+hv.getUint16(26,true)+hv.getUint16(28,true); return en; }); }));
      }).then(function(ents){
        var by={}; ents.forEach(function(en){ by[en.name]=en; });
        var j=by['dersler.json']; if(!j) throw new Error('zip');

  var vSeq=[], vIdx=0, vs=1, vtx=0, vty=0, vfit=1, vpts=new Map(), vlast=null, vtap=0, vpinch=null, vUrl=null;
  function vEls(){ return {V:document.getElementById('viewer'), st:document.getElementById('stage'), im:document.getElementById('vImg')}; }
  function vApply(){ vEls().im.style.transform='translate('+vtx+'px,'+vty+'px) scale('+vs+')'; }
  function vClamp(){ var e=vEls(), W=e.st.clientWidth, H=e.st.clientHeight, iw=e.im.naturalWidth*vs, ih=e.im.naturalHeight*vs;
    vtx = iw<=W ? (W-iw)/2 : Math.min(0, Math.max(W-iw, vtx)); vty = ih<=H ? (H-ih)/2 : Math.min(0, Math.max(H-ih, vty)); }
  function vFitW(){ var e=vEls(); if(!e.im.naturalWidth) return; var W=e.st.clientWidth, H=e.st.clientHeight;
    vfit=Math.min(W/e.im.naturalWidth, 1.6); var whole=Math.min(W/e.im.naturalWidth, H/e.im.naturalHeight);
    if(e.im.naturalHeight*vfit > H*1.15 && whole > vfit*0.55) vfit=whole; vs=vfit; vtx=0; vty=0; vClamp(); vApply(); }

  function suggest(text){
    var s=text.toLocaleLowerCase('tr');
    if(/\b(al|ekle|listeye|market|süt|ekmek)\b/.test(s)) return 'alisveris';
    if(/(fikir|belki|olsa iyi olur|-ebilir|yapsak)/.test(s)) return 'fikir';
    if(/(önemli|acil|unutma)/.test(s)) return 'onemli';
    if(/(yarın|bugün|pazartesi|salı|çarşamba|perşembe|cuma|cumartesi|pazar|haftaya|saat|\d{1,2}[:.]\d{2}|'?d[ae]\b)/.test(s)) return 'planli';
    if(/(ara|git|yap|hallet|kontrol|öde|gönder)/.test(s)) return 'yapilacak';
    return null;
  }

    return el('button',{class:'row'+(it.done?' done':''),type:'button',style:'background:var('+((heading(it.heading)||{}).color||'--chip')+')',onclick:function(){
      it.done = !it.done;
      if(it.done){
        it.doneAt = today(); mark(S.doneDays);
        var pr = priorities();
        var all = isPriority && pr.length===3 && pr.every(function(x){return x.t ? x.t.doneAt : x.i.done;});
        all ? award(40,'3 öncelik bitti, harika gün') : award(10,'Tamamlandı');
      } else { it.doneAt=null; unaward(10); }
      save(); render();
    }},[el('span',{class:'box'}), el('span',{class:'t',text:it.text}), el('small',{text:(heading(it.heading)||{}).name||''})]);
  }

  function renderPool(){
    var pool = S.items.filter(function(i){return !i.heading});
    var cats = S.headings.filter(function(h){return h.type==='category'});
    app.append(el('button',{class:'back',type:'button',text:'‹ Bugün',onclick:function(){view={name:'home'};render();}}), el('h2',{text:'Havuz'}));
    if(!pool.length){ app.append(el('div',{class:'empty',text:'Havuz boş. Aşağıdaki çubuğa ne yazarsan önce buraya düşer.'})); return; }
    app.append(el('p',{class:'note',text:'Klasöre dokun, kayıt yerine gider. Altı çizili olan Mali\'nin önerisi.'}));
    var list=el('div',{class:'list'});
    pool.slice().reverse().forEach(function(it){
      var card = el('div',{class:'pi'});
      var f = el('div',{class:'folders'});
      var ordered = cats.slice().sort(function(a,b){ return (b.id===it.suggested) - (a.id===it.suggested); });
      ordered.forEach(function(h){
        f.append(el('button',{type:'button',class:h.id===it.suggested?'sug':'',text:h.name,onclick:function(){
          card.classList.add('out'); mark(S.activeDays);
          var w = (h.id==='yapilacak'||h.id==='planli') && parseWhen(it.text);
          if(h.id==='alisveris'){ addProducts(it.text); S.items=S.items.filter(function(x){return x!==it}); }
          else if(w){ addTask(w); S.items=S.items.filter(function(x){return x!==it}); }
          else it.heading=h.id;
          var left = S.items.filter(function(i){return !i.heading}).length;
          left ? award(5,h.name+' klasörüne gitti') : award(25,'Havuz boşaldı 🎉');
          save(); setTimeout(render,250);
        }}));
      });
      f.append(el('button',{type:'button',class:'del',text:'Sil',onclick:function(){ S.items=S.items.filter(function(x){return x!==it}); save(); render(); }}));
      card.append(el('q',{text:it.text}), el('small',{text:new Date(it.created).toLocaleString('tr-TR',{weekday:'short',hour:'2-digit',minute:'2-digit'})}), f);
      list.append(card);
    });
    app.append(list);
  }

  function renderHeading(h){
    if(!h){ view={name:'home'}; return render(); }
    app.append(el('button',{class:'back',type:'button',text:'‹ Bugün',onclick:function(){view={name:'home'};render();}}));
    if(h.id==='alisveris'){ renderShop(h); return; }
    if(h.id==='yapilacak'){ renderTodo(); return; }
    if(h.type==='room'){
      if(h.id==='ingilizce'){ renderEnglish(); return; }
      var txt = h.id==='ingilizce' ? ''
              : h.id==='rutinler' ? 'Sabah ve akşam rutinlerin, her biri kendi zinciriyle. İçeriğini birlikte belirleyeceğiz.'
              : 'Bu oda şimdilik boş. Bir fikrin olduğunda projede bana yaz, birlikte kuralım.';
      app.append(el('div',{class:'room',style:h.color?'--tile:var('+h.color+')':''},[el('span',{class:'ico',text:h.icon||'·'}), el('h2',{text:h.name}), el('p',{text:txt})]));
    } else {
      var items = S.items.filter(function(i){return i.heading===h.id});
      app.append(el('h2',{text:h.name}));
      var list=el('div',{class:'list'});
      if(!items.length) list.append(el('div',{class:'empty',text:'Bu klasör boş. Havuzdan buraya kayıt ayırabilirsin.'}));
      items.filter(function(i){return !i.done}).concat(items.filter(function(i){return i.done})).forEach(function(it){ list.append(itemRow(it,false)); });
      app.append(list);
    }
    if(!DEFAULT.headings.some(function(d){return d.id===h.id})){
      app.append(el('button',{class:'danger',type:'button',text:'Bu başlığı sil (içindekiler havuza döner)',onclick:function(){
        S.items.forEach(function(i){ if(i.heading===h.id){ i.heading=null; } });
        S.headings=S.headings.filter(function(x){return x!==h}); save(); view={name:'home'}; render();
      }}));
    }
  }

  function renderShop(h){
    var open = S.shop.filter(function(x){return !x.boughtAt});
    var got = S.shop.filter(function(x){return x.boughtAt});
    app.append(el('h2',{text:'Alışveriş'}));
    var f = el('form',{class:'shopadd',autocomplete:'off'},[
      el('input',{type:'text',id:'shopIn',placeholder:'süt, ekmek ve yumurta','aria-label':'Ürün ekle'}),
      el('button',{type:'submit',text:'Ekle'})]);
    f.addEventListener('submit',function(e){
      e.preventDefault(); var v=document.getElementById('shopIn').value.trim(); if(!v) return;
      addProducts(v); mark(S.activeDays); save(); buzz(); render();
      setTimeout(function(){ var i=document.getElementById('shopIn'); if(i) i.focus(); },0);
    });
    app.append(f);
    var list = el('div',{class:'list'});
    if(!S.shop.length) list.append(el('div',{class:'empty',text:'Liste boş. Yukarıya ya da Mali çubuğuna "süt ve ekmek ekle" yaz.'}));
    open.concat(got).forEach(function(x){
      list.append(el('button',{class:'row'+(x.boughtAt?' done':''),type:'button',style:'background:var(--r-shop)',onclick:function(){
        if(x.boughtAt){ x.boughtAt=null; unaward(2); }
        else {
          x.boughtAt=today();
          var left=S.shop.filter(function(y){return !y.boughtAt}).length;
          left ? award(2,'Alındı') : award(12,'Liste bitti 🎉');
        }
        save(); render();
      }},[el('span',{class:'box'}), el('span',{class:'t',text:x.name})]));
    });
    app.append(list);
    if(got.length) app.append(el('p',{class:'note',text:'Alınanlar yarın kendiliğinden silinir. Her ürün +2, liste bitince +10 daha.'}));
  }

  function renderAdd(){
    var type='category', colors=['--r-task','--r-note','--r-en','--r-plan','--r-shop','--r-rt'];
    app.append(el('button',{class:'back',type:'button',text:'‹ Vazgeç',onclick:function(){view={name:'home'};render();}}), el('h2',{text:'Yeni başlık'}));
    var name = el('input',{id:'newName',type:'text',placeholder:'ör. Sağlık',maxlength:'24'});
    var bCat = el('button',{type:'button',class:'on'},[el('b',{text:'Kategori'}), el('small',{text:'İçine yapılacak, not, fikir atarsın. Havuzda klasör olur.'})]);
    var bRoom = el('button',{type:'button'},[el('b',{text:'Oda'}), el('small',{text:'Kendi dünyası olan mini uygulama. İçini birlikte kurarız.'})]);
    bCat.onclick=function(){type='category';bCat.classList.add('on');bRoom.classList.remove('on');};
    bRoom.onclick=function(){type='room';bRoom.classList.add('on');bCat.classList.remove('on');};
    var form = el('form',{class:'form'},[el('label',{for:'newName',text:'Ad'}), name, el('label',{text:'Ne olsun?'}), el('div',{class:'types'},[bCat,bRoom]), el('button',{class:'primary',type:'submit',text:'Kaydet'})]);
    form.addEventListener('submit',function(e){
      e.preventDefault(); var n=name.value.trim(); if(!n){ name.focus(); return; }
      var used = S.headings.filter(function(h){return !h.empty}).length;
      S.headings.splice(S.headings.length-1,0,{id:'h'+Date.now(),name:n,type:type,color:colors[used%colors.length],icon:n.charAt(0).toLocaleUpperCase('tr')});
      save(); view={name:'home'}; render();
    });
    app.append(form);
    setTimeout(function(){name.focus()},50);
  }

  // ---------- Mali çubuğu ----------
  document.getElementById('maliForm').addEventListener('submit',function(e){
    e.preventDefault();
    var inp=document.getElementById('maliInput'), t=inp.value.trim(); if(!t) return;
    var w=parseWhen(t);
    if(w){ var nt=addTask(w); mark(S.activeDays); inp.value=''; save(); flash('Takvime eklendi · '+nt.title, whenLabel(nt)); render(); return; }
    S.items.push({id:'i'+Date.now(),text:t,created:Date.now(),heading:null,suggested:suggest(t),done:false,doneAt:null});
    mark(S.activeDays); inp.value=''; save();
    var n=S.items.filter(function(i){return !i.heading}).length;
    document.getElementById('toastMsg').textContent='Havuza eklendi'; document.getElementById('toastPts').textContent=n+' bekliyor';
    var t2=document.getElementById('toast'); t2.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){t2.classList.remove('show')},1400);
    buzz(); render();
  });

  document.getElementById('restore').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    f.text().then(function(t){
      try{ var o=JSON.parse(t); if(!o||o.v!==1||!Array.isArray(o.items)) throw 0;
        if(!confirm('Yedek yüklensin mi? Telefondaki kayıtların yerine geçer.')) return;
        load(o); save(); view={name:'home'}; render(); }
      catch(x){ alert('Bu dosya Hayat yedeği değil.'); }
      e.target.value='';
    });
  });

  // ---------- sesle söyle (Chrome) ----------
  // Sen susunca 3 sn bekler, sonra kaydeder. İstersen 🎤'ye tekrar basıp hemen bitirirsin.
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    var mic=document.getElementById('mic'), inp=document.getElementById('maliInput'), hint=document.getElementById('saveNote');
    var hintText=hint.textContent, rec=null, listening=false, kept='', sess='', interim='', quiet=null, hardStop=null, startedAt=0;
    var SILENCE=3000, FIRST_WAIT=7000, MAX=45000;
    mic.hidden=false;
    function lc(x){ return x.toLocaleLowerCase('tr'); }
    function joined(){ return (kept+' '+sess+' '+interim).replace(/\s+/g,' ').trim(); }
    function arm(ms){ clearTimeout(quiet); quiet=setTimeout(function(){ finish(); }, ms); }
    function begin(){
      rec=new SR(); rec.lang='tr-TR'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
      sess=''; interim='';
      rec.onresult=function(ev){
        interim='';
        for(var i=ev.resultIndex;i<ev.results.length;i++){
          var t=ev.results[i][0].transcript.trim(); if(!t) continue;
          if(ev.results[i].isFinal){
            // Android bazen aynı cümleyi büyüyerek tekrar gönderir: tekrarı ekleme
            if(sess && lc(t).indexOf(lc(sess))===0) sess=t;
            else if(!sess || lc(sess).slice(-lc(t).length)!==lc(t)) sess=(sess+' '+t).trim();
          } else interim+=' '+t;
        }
        inp.value=joined(); arm(SILENCE);
      };
      rec.onerror=function(e){ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ listening=false; hint.textContent='Mikrofon izni yok. Chrome ayarlarından izin ver.'; } };
      rec.onend=function(){
        // telefon kendi kendine durdurduysa ve süre dolmadıysa dinlemeye devam et
        kept=(kept+' '+sess+' '+interim).trim(); sess=''; interim='';
        if(listening && Date.now()-startedAt<MAX){ try{ begin(); return; }catch(x){} }
        if(listening) finish();
      };
      rec.start();
    }
    function finish(){
      if(!listening) return;
      listening=false; clearTimeout(quiet); clearTimeout(hardStop);
      var text=joined(); kept=''; sess=''; interim='';
      try{ rec && rec.stop(); }catch(x){}
      mic.classList.remove('on'); mic.textContent='🎤'; hint.textContent=hintText;
      inp.value=text;
      if(text) document.getElementById('maliForm').requestSubmit();
    }
    mic.addEventListener('click',function(){
      if(listening){ finish(); return; }
      listening=true; kept=''; startedAt=Date.now(); inp.value='';
      mic.classList.add('on'); mic.textContent='■';
      hint.textContent='Dinliyorum… Bitince sus ya da ■ tuşuna bas.';
      arm(FIRST_WAIT); hardStop=setTimeout(finish, MAX);
      try{ begin(); }catch(x){ finish(); }
    });
  }

  if(location.hash==='#pazar'){ view={name:'review'}; history.replaceState(null,'',location.pathname); }
  render();
})();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
