<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1316">
<script>try{if(localStorage.getItem('hayat-theme')==='light'){document.documentElement.dataset.theme='light';document.querySelector('meta[name="theme-color"]').content='#F4F6F5';}}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Hayat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Tek sütun telefon uygulaması: üstte günün halkası, ortada öncelikler, altta 4 sekme + ortada Mali tuşu.
   Tasarım şartnamesi: /tasarim/TASARIM-SPEC.md (proje dosyaları). Renk/yazı her zaman token'dan. */
:root{
  /* Koyu görünüm (Gece petrolü) varsayılan; açık görünüm sadece data-theme="light" ile */
  --paper:#0A1316; --card:#111D21; --ink:#E7EFEE; --ink-2:#8FA3A6; --line:#213238; --track:#24383E;
  --house:#3BA6B8; --on-house:#061114; --house-tint:#123038;
  --sun:#E2AE48; --sun-ink:#2A1C00; --sun-deep:#E2AE48;
  --leaf:#46B983; --on-leaf:#061114; --late:#E46F5C; --late-tint:#36201C;
  --c-shop:#6FA3DD; --c-task:#E2AE48; --c-note:#A396EE; --c-en:#EE7C8F; --c-rt:#55C08E; --c-plan:#BC97E6;
  --hero:linear-gradient(135deg,#14343C 0%,#0F2025 72%); --tint:18%; --toast:#1E3036; --toast-ink:#E7EFEE; --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.55);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* eski adlar: kayıtlı başlık renkleri (--r-*) yeni oda renklerine bağlanır */
  --r-task:var(--c-task); --r-note:var(--c-note); --r-en:var(--c-en); --r-plan:var(--c-plan); --r-shop:var(--c-shop); --r-rt:var(--c-rt);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --paper:#F4F6F5; --card:#FFFFFF; --ink:#13252B; --ink-2:#4E5F64; --line:#DCE3E1; --track:#E3E9E7;
  --house:#0F4C5C; --on-house:#FFFFFF; --house-tint:#E2EEF0;
  --sun:#F4B740; --sun-ink:#3D2A00; --sun-deep:#A86F00;
  --leaf:#1E7F55; --on-leaf:#FFFFFF; --late:#B83A2A; --late-tint:#FBE9E5;
  --c-shop:#2F6FB3; --c-task:#A86F00; --c-note:#5B4BC9; --c-en:#C23A50; --c-rt:#1F8A5B; --c-plan:#7E4DB5;
  --hero:linear-gradient(135deg,#E2EEF0 0%,#FFFFFF 72%); --tint:12%; --toast:#13252B; --toast-ink:#F4F6F5; --scrim:rgba(19,37,43,.45); --shadow:0 12px 32px rgba(15,76,92,.16); color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--paper);margin:0}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(112px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--house);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none}
h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}

/* üst kısım */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.top .date{font-size:13px;color:var(--ink-2)}
.top h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;margin:0;color:var(--ink)}
.pts{display:inline-flex;align-items:center;gap:4px;background:var(--sun);color:var(--sun-ink);border-radius:99px;padding:6px 12px 6px 9px;font-family:var(--display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.pts svg{width:16px;height:16px}
.pts.pop{transform:scale(1.18)}

/* günün halkası */
.hero{background:var(--hero);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center}
.ring{width:88px;height:88px;display:block}
.ring text{font-family:var(--display);font-weight:800;fill:var(--ink);font-variant-numeric:tabular-nums}
.ring path{fill:none;stroke-width:9;stroke-linecap:round;stroke:var(--track);transition:stroke .3s .15s}
.ring path.on{stroke:var(--sun-deep)}
.hero b{font-size:16.5px;display:block;line-height:1.3}
.hero small{font-size:13px;color:var(--ink-2);display:block;margin-top:2px}
.level{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.level strong{color:var(--ink);font-weight:600}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:color-mix(in srgb,var(--paper) 55%,transparent);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:left;font:inherit;color:var(--ink);min-height:56px}
.stat i{font-style:normal;font-size:11.5px;color:var(--ink-2);display:block}
.stat b{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
button.stat b{color:var(--house)}
.bar{flex:1;height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun-deep);border-radius:99px;transition:width .4s}

/* bölüm adı (büyük harf yok) */
.label{font-size:15px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;margin-bottom:-6px}
.label button{border:0;background:none;color:var(--house);font-weight:600;font-size:14px;padding:6px 0}
.warn{color:var(--late)}

/* liste: tek kart, satırlar arası ince çizgi */
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:10px 8px 10px 14px;min-height:56px;text-align:left;width:100%;color:var(--ink)}
.row + .row, .list > * + .row{border-top:1px solid var(--line)}
.box{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--ink-2);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.row.done .box{background:var(--leaf);border-color:var(--leaf);transform:scale(1.06)}
.row.done .box::after{content:"";width:7px;height:12px;border:solid var(--on-leaf);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--ink-2)}
.row small{color:var(--ink-2);font-size:12.5px;text-align:right;flex:none;max-width:45%}
.row.late small{color:var(--late);font-weight:600}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tx small{text-align:left;max-width:none}
.row.task{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row.step{padding-left:30px}
.row .tm{flex:none;width:42px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.row.late .tm{color:var(--late)}
.more{flex:none;width:36px;height:36px;margin:-4px 0;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.more svg{width:20px;height:20px}
.empty{color:var(--ink-2);font-size:14.5px;background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:16px}
.list .empty{border:0;border-radius:0}
.note{font-size:13px;color:var(--ink-2)}

/* zincirler */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chain{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px}
.chain b{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.chain b svg{width:20px;height:20px;color:var(--sun-deep)}
.chain span{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.days7{display:flex;gap:3px}
.days7 i{width:11px;height:11px;border-radius:3px;background:var(--track)}
.days7 i.y{background:var(--leaf)}
.days7 i.t{background:transparent;box-shadow:inset 0 0 0 2px var(--leaf)}

/* şeritler */
.poolbar,.latebar,.nudge{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;padding:10px 10px 10px 14px;text-align:left;font:inherit;min-height:56px}
.poolbar,.nudge{background:var(--house-tint);color:var(--ink)}
.poolbar span:first-child,.nudge .tx{flex:1;min-width:0}
.nudge .tx b{display:block;font-size:15px}
.nudge .tx small{font-size:12.5px;color:var(--ink-2)}
.poolbar span:last-child,.nudge .go{background:var(--house);color:var(--on-house);border-radius:12px;padding:8px 14px;font-weight:600;font-size:14px}
.latebar{background:var(--card);border:1px solid color-mix(in srgb,var(--late) 45%,var(--line));color:var(--late);font-weight:600;font-size:14.5px}
.latebar span:first-child{flex:1}
.latebar svg{width:18px;height:18px}

/* Pazar kartı */
.review{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;font:inherit;width:100%}
.review b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.2}
.review small{font-size:13px;color:var(--ink-2);grid-column:1}
.review .go{grid-column:2;grid-row:1/3;background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:9px 16px;font-weight:600;font-size:14.5px}

/* odalar ve klasörler */
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rtile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;min-height:104px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;transition:transform .15s;min-width:0}
.rtile:active{transform:scale(.97)}
.rtile b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.rtile small{font-size:12px;color:var(--ink-2)}
.rtile.ghost{background:transparent;border:2px dashed var(--ink-2)}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--hue,var(--ink-2)) var(--tint),var(--card));color:var(--hue,var(--ink-2));margin-bottom:auto;font-family:var(--display);font-weight:800;font-size:16px;flex:none}
.ico svg{width:20px;height:20px}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;min-height:44px;padding:0 14px 0 7px;font-size:14.5px;font-weight:500;color:var(--ink)}
.cat .dot{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;background:color-mix(in srgb,var(--hue,var(--ink-2)) var(--tint),var(--card));color:var(--hue,var(--ink-2));font-weight:800;font-size:13px}
.cat .dot svg{width:15px;height:15px}
.cat em{font-style:normal;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cat.add{border-style:dashed;padding-left:14px;color:var(--house);font-weight:600}
.row .ico{margin:0}

/* tuşlar */
.primary.soft{background:var(--house-tint);color:var(--house)}
.primary{border:0;border-radius:14px;background:var(--house);color:var(--on-house);font-weight:600;min-height:48px;padding:0 16px}
.danger{border:0;border-radius:14px;background:transparent;color:var(--late);font-weight:600;min-height:44px;padding:0 12px}
.back{align-self:flex-start;border:0;background:transparent;color:var(--house);border-radius:12px;padding:8px 4px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;gap:2px;margin-bottom:-8px}
.textlink{align-self:center;border:0;background:none;color:var(--house);font:inherit;font-weight:600;padding:10px;min-height:44px}
.linkbtn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:0 22px;margin-top:4px}
.backup{display:flex;gap:8px}
.backup button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;min-height:48px;font:inherit;font-weight:500}

/* ekleme kutusu */
.shopadd{display:flex;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:4px;align-items:center}
.shopadd:focus-within{border-color:var(--house);box-shadow:0 0 0 3px var(--house-tint)}
.shopadd input{flex:1;min-width:0;border:0;background:transparent;padding:10px 10px;font:inherit;color:var(--ink);outline:none}
.shopadd button{border:0;border-radius:12px;background:var(--house);color:var(--on-house);font-weight:600;min-height:44px;padding:0 16px;flex:none}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.headrow{display:flex;align-items:center;gap:12px}
.headrow .ico{width:44px;height:44px;border-radius:14px;margin:0}

/* havuz */
.pi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:opacity .25s,transform .25s}
.pi.out{opacity:0;transform:translateX(40px)}
.pi q{quotes:"„" "“";overflow-wrap:anywhere;font-size:17px;font-weight:500}
.pi small{color:var(--ink-2);font-size:12.5px;margin-top:-6px}
.pi .sugg{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.pi .sugg svg{width:14px;height:14px;color:var(--sun-deep)}
.folders{display:flex;flex-wrap:wrap;gap:6px}
.folders button{border:1.5px solid var(--line);background:transparent;border-radius:99px;min-height:40px;padding:0 14px;font-size:14px;color:var(--ink)}
.folders button[style]{display:inline-flex;align-items:center;gap:8px}
.folders button[style]::before{content:"";width:8px;height:8px;border-radius:99px;background:var(--hue)}
.pi .primary{background:var(--house-tint);color:var(--house);border:1px solid color-mix(in srgb,var(--house) 35%,transparent);display:flex;align-items:center;justify-content:center;gap:8px}
.pi q{font-weight:600;font-size:17.5px;line-height:1.35}
.folders button.del{margin-left:auto;border-color:transparent;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;padding:0 10px}
.folders button.del svg{width:18px;height:18px}

/* oda sayfası */
.room{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px;border-radius:24px;background:color-mix(in srgb,var(--hue,var(--house)) var(--tint),var(--card))}
.room .ico{width:52px;height:52px;border-radius:16px;background:var(--card);margin:0;font-size:22px}
.room .ico svg{width:26px;height:26px}
.room p{color:var(--ink-2);max-width:40ch}

/* form */
.form{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line)}
.form label{font-size:14px;font-weight:600;color:var(--ink)}
.form input{border:1.5px solid var(--line);border-radius:14px;min-height:48px;padding:0 14px;font:inherit;background:var(--paper);color:var(--ink)}
.form input:focus{border-color:var(--house);outline:none;box-shadow:0 0 0 3px var(--house-tint)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types button{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.types button small{color:var(--ink-2);font-size:12.5px;line-height:1.35}
.types button.on{border-color:var(--house);box-shadow:inset 0 0 0 1px var(--house)}
.sw{display:flex;gap:12px;flex-wrap:wrap;padding:4px 0}
.sw button{width:40px;height:40px;border-radius:99px;border:0;background:var(--hue)}
.sw button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.stepline{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:14.5px}
.gcal{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-height:60px}
.gcal .ico{--hue:var(--c-shop);margin:0}
.gcal span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.gcal b{font-weight:600}
.gcal small{color:var(--ink-2);font-size:12.5px}

/* takvim */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:40px;font:inherit;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;gap:8px}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:44px;height:44px;display:grid;place-items:center}
.nav .mid{flex:1;border:0;background:transparent;font-size:15.5px;font-weight:700}
.week{display:flex;flex-direction:column;gap:14px}
.day{display:flex;flex-direction:column;gap:8px}
.dh{display:flex;align-items:baseline;gap:8px;font-size:14.5px}
.dh span{color:var(--ink-2)}
.dh em{margin-left:auto;font-style:normal;font-size:13px;font-weight:700;color:var(--house)}
.day.today .dh b{color:var(--house)}
.emptyday{font-size:13.5px;color:var(--ink-2);padding-left:2px}
details.late{background:var(--card);border:1px solid color-mix(in srgb,var(--late) 45%,var(--line));border-radius:18px;overflow:hidden}
details.late summary{list-style:none;display:flex;align-items:center;gap:10px;padding:0 14px;min-height:52px;color:var(--late);font-weight:600;font-size:14.5px;cursor:pointer}
details.late summary::-webkit-details-marker{display:none}
details.late summary svg{width:18px;height:18px}
details.late summary .chev{margin-left:auto;transition:transform .2s}
details.late[open] summary .chev{transform:rotate(180deg)}
details.late .list{border-radius:0;border:0;border-top:1px solid var(--line)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .wd{text-align:center;font-size:12px;color:var(--ink-2);padding:4px 0}
.cell{border:0;background:var(--card);border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;color:var(--ink);padding:0;min-width:0}
.cell.out{opacity:.4}
.cell.today b{color:var(--house);text-decoration:underline;text-underline-offset:3px}
.cell.sel{background:var(--house);color:var(--on-house)}
.cell.sel.today b{color:var(--on-house)}
.dots{display:flex;gap:2px;height:5px}
.dots span{width:5px;height:5px;border-radius:50%;background:var(--sun-deep)}
.cell.sel .dots span{background:var(--sun)}

/* İngilizce */
.wk{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--ink);font:inherit}
.wk .code{font-family:var(--display);font-weight:800;font-size:22px;color:var(--c-en)}
.wk b{display:block;font-size:16px}
.wk small{color:var(--ink-2);font-size:12.5px}
.wk .go{color:var(--ink-2)}
.wk.now{border:2px solid var(--c-en)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.mod{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0;color:var(--ink);font:inherit}
.mod .n{font-family:var(--display);font-weight:800;font-size:20px;color:var(--c-en);line-height:1}
.mod.star .n{color:var(--leaf)}
.mod.page .n{color:var(--ink-2)}
.mod b{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.mod small{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}

/* alt sekmeler + Mali tuşu */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:0 4px env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;height:72px;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--ink-2);position:relative;min-height:56px;padding:0}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--house);font-weight:700}
.tab .badge{position:absolute;top:4px;left:calc(50% + 5px);background:var(--late);color:var(--card);font-size:10.5px;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.malibtn{width:66px;height:66px;border-radius:99px;border:4px solid var(--paper);background:var(--house);color:var(--on-house);display:grid;place-items:center;margin:-30px auto 0;box-shadow:0 6px 18px color-mix(in srgb,var(--house) 45%,transparent);transition:transform .15s}
.malibtn:active{transform:scale(.94)}
.malibtn svg{width:28px;height:28px}

/* Mali kartı (alttan açılır) */
.sheetwrap{position:fixed;inset:0;z-index:17}
.sheetwrap .dim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.sheet #saveNote{font-size:13.5px;color:var(--ink-2);min-height:20px}
.sheet #maliInput{width:100%;border:1.5px solid var(--line);border-radius:16px;min-height:56px;padding:12px 14px;font:inherit;font-size:18px;font-weight:500;background:var(--paper);color:var(--ink)}
.sheet #maliInput:focus{outline:none;border-color:var(--house);box-shadow:0 0 0 3px var(--house-tint)}
.sheet .acts{display:flex;gap:10px;align-items:center}
#mic{flex:none;width:64px;height:64px;border-radius:99px;border:0;background:var(--house-tint);color:var(--house);display:grid;place-items:center}
#mic svg{width:28px;height:28px}
#mic.on{background:var(--sun);color:var(--sun-ink);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.sheet .acts .primary{flex:1;min-height:56px;font-size:16.5px}
.sheet .x{position:absolute;right:12px;top:10px;width:44px;height:44px;border:0;background:transparent;color:var(--ink-2);border-radius:12px;display:grid;place-items:center}

/* ödül kartı */
.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--toast);color:var(--toast-ink);box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;transform:translateY(16px);opacity:0;transition:all .25s;pointer-events:none;z-index:16}
.toast.show{transform:none;opacity:1}
.toast span{flex:1}
.toast b{color:var(--sun);font-family:var(--display);font-weight:800}

/* Bugün: küçük haftalık program */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wcell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px;font:inherit;color:var(--ink);min-width:0}
.wcell span{font-size:11.5px;color:var(--ink-2)}
.wcell b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.wcell.past{opacity:.6}
.wcell.today b{color:var(--house);text-decoration:underline;text-underline-offset:3px}
.wcell.sel{background:var(--house);border-color:var(--house);color:var(--on-house);opacity:1}
.wcell.sel span,.wcell.sel.today b{color:var(--on-house)}
.wcell.sel .dots span{background:var(--sun)}
.daylogs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding:0 4px}
.daylogs svg{width:16px;height:16px;flex:none;color:var(--c-plan)}

/* büyük kutucuklar: Alışveriş, Kayıt defteri, Para */
.big{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.bighead,.tname{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;width:100%;color:var(--ink);min-height:44px;font:inherit}
.bighead .ico,.trow .ico{margin:0}
.bighead .tx b{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15}
.bighead .tx small,.trow .tx small{font-size:12.5px;color:var(--ink-2)}
.bighead > svg,.tname > svg{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;min-height:40px;padding:0 14px;font-size:14px;color:var(--ink)}
.chip:active{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.listtabs{margin:-4px 0 12px}
.listtabs .chip.on{background:var(--house);color:var(--on-leaf,#fff);border-color:var(--house);font-weight:600}
.chip.more2{color:var(--house);font-weight:600;border-style:dashed}
.trow{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line);padding-top:8px}
.trow.first{border-top:0;padding-top:0}
.trow .tx b{font-size:15px;font-weight:600}
.tname{flex:1;min-width:0}
.plus{flex:none;border:0;border-radius:12px;background:var(--house-tint);color:var(--house);font-weight:600;font-size:14px;min-height:44px;padding:0 12px;display:inline-flex;align-items:center;gap:4px}
.plus svg{width:16px;height:16px}
.plus:active{transform:scale(.95)}
.hist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14.5px}
.hrow + .hrow{border-top:1px solid var(--line)}
.hrow span{flex:1}
.hrow small{color:var(--ink-2);font-size:12.5px}
.x2{border:0;background:none;color:var(--ink-2);width:40px;height:40px;display:grid;place-items:center;border-radius:10px}
.x2 svg{width:16px;height:16px}
.msum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.msum div{background:var(--paper);border-radius:14px;padding:10px;min-width:0}
.msum small{font-size:12px;color:var(--ink-2);display:block}
.msum b{font-family:var(--display);font-weight:800;font-size:clamp(13px,4vw,17px);font-variant-numeric:tabular-nums;white-space:nowrap}
.app > .msum div{background:var(--card);border:1px solid var(--line)}
.msum .g b{color:var(--late)} .msum .i b{color:var(--leaf)} .msum .y b{color:var(--house)}
.cbars{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.cbar{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:10px;font-size:13.5px}
.cbar b{font-weight:600;font-variant-numeric:tabular-nums}
.cbar .bar i{background:var(--house)}
.app > .msum{background:var(--hero);border:1px solid var(--line);border-radius:20px;padding:6px;gap:0}
.app > .msum div{background:transparent;border:0;border-radius:0;padding:10px 10px}
.app > .msum div + div{border-left:1px solid var(--line)}
.app > .msum b{font-size:clamp(14px,4.2vw,19px)}
.list + .note{margin:8px 2px 0}
.seg.seg3{grid-template-columns:1fr 1fr 1fr}
.mrowin{display:grid;grid-template-columns:110px 1fr;gap:8px}
.mrowin input{min-width:0}
.medit{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line)}
.medit small{color:var(--ink-2,var(--ink));opacity:.8}
.medit .chip.on{background:var(--house);color:var(--on-leaf,#fff);border-color:var(--house)}
.mrow b{flex:none;font-variant-numeric:tabular-nums;font-weight:700}
.mrow.gider b{color:var(--late)} .mrow.gelir b{color:var(--leaf)} .mrow.yatirim b{color:var(--house)}
.row.fix .paybtn{flex:none;background:var(--house-tint);color:var(--house);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.fixform{display:flex;gap:8px;padding:8px 14px 12px;border-top:1px solid var(--line)}
.fixform input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;min-height:48px;padding:0 14px;font:inherit;background:var(--paper);color:var(--ink)}
.fixform .primary{min-height:48px}
.fixline{display:flex;align-items:center;gap:8px;border:0;background:var(--paper);border-radius:12px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink-2);text-align:left;min-height:40px}
.fixline svg{width:16px;height:16px;flex:none;color:var(--sun-deep)}
.row .cnt{flex:none;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.nav button[disabled]{opacity:.35}
.label .hh{font-family:var(--display);font-weight:800;font-size:18px;color:var(--leaf)}
.hhbars .bar i{background:var(--leaf)}
[hidden]{display:none!important}

/* ders görüntüleyici (tam ekran, hep koyu) */
.viewer{position:fixed;inset:0;background:#11161d;color:#f2f5f9;display:flex;flex-direction:column;z-index:20}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0b0f14}
.vbar.top{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.vbar.bottom{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));justify-content:center;flex-wrap:wrap}
.vt{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc{font-size:13px;opacity:.75}
.vb{border:0;background:#26303b;color:#f2f5f9;border-radius:12px;min-width:44px;height:44px;padding:0 12px;font:inherit;font-size:16px}
.vb.wide{font-size:14px;font-weight:600}
.stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#fff}
.stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(17,22,29,.85);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:99px;pointer-events:none;transition:opacity .6s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<input type="file" id="restore" accept="application/json,.json" hidden>
<div class="toast" id="toast"><span id="toastMsg">Tamamlandı</span><b id="toastPts">+10</b></div>

<script>
(function(){
  var DEFAULT = {
    v:1, points:0, activeDays:[], doneDays:[],
    headings:[
      {id:"yapilacak",name:"Yapılacak",type:"category",color:"--r-task",icon:"✓"},
      {id:"fikir",name:"Fikir",type:"category",color:"--r-note",icon:"✦"},
      {id:"onemli",name:"Önemli",type:"category",color:"--r-en",icon:"!"},
      {id:"planli",name:"Planlı",type:"category",color:"--r-plan",icon:"▦"},
      {id:"alisveris",name:"Alışveriş",type:"category",color:"--r-shop",icon:"☰"},
      {id:"ingilizce",name:"İngilizce",type:"room",color:"--r-en",icon:"Aa"},
      {id:"rutinler",name:"Rutinler",type:"room",color:"--r-rt",icon:"↻"},
      {id:"bos",name:"Boş oda",type:"room",color:"",icon:"·",empty:true}
    ],
    items:[],  // {id,text,created,heading|null,suggested|null,done:false,doneAt}
    shop:[],   // {id,name,created,boughtAt|null,list?}  list yok = Ana liste
    lists:[{id:'online',name:'Online'}],   // ek alışveriş listeleri
    tasks:[],  // {id,title,date,time|null,created,doneAt|null}
    logs:[],   // kayıt defteri: {id,tr,date,amount|null,created}
    money:[]   // {id,type:gider|gelir|yatirim,amount,cur,cat,note,date,created}
  };
  var S = JSON.parse(JSON.stringify(DEFAULT));
  var APP_VERSION = '0.5.0';   // her yayında artır ve SURUMLER.md'ye 1 satır yaz
  var view = {name:"home"};
  var app = document.getElementById('app');

  // ---------- kayıt: sadece bu telefonda ----------
  var LOCKED = false;   // kayıt okunamazsa üstüne yazma
  function lsGet(){
    var s=null;
    try{ s = localStorage.getItem('hayat-state'); }catch(e){ return null; }
    if(!s) return null;
    try{ var o=JSON.parse(s); if(o && o.v===1) return o; }catch(e){}
    LOCKED = true; return null;
  }
  var lastCopy = 0;
  function lsSet(){
    if(LOCKED) return;
    try{
      var cur = localStorage.getItem('hayat-state');
      if(cur && Date.now()-lastCopy > 600000){ localStorage.setItem('hayat-state-prev', cur); lastCopy = Date.now(); }
      localStorage.setItem('hayat-state', JSON.stringify(S));
    }catch(e){}
  }
  function save(){ lsSet(); }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  function load(obj){
    if(!obj || obj.v !== 1) return;
    LOCKED = false;
    S = obj;
    Object.keys(DEFAULT).forEach(function(k){ if(S[k]===undefined || (Array.isArray(DEFAULT[k]) && !Array.isArray(S[k]))) S[k] = JSON.parse(JSON.stringify(DEFAULT[k])); });
    if(!Array.isArray(S.shop)) S.shop = [];
    if(!Array.isArray(S.lists)) S.lists = [{id:'online',name:'Online'}];
    if(!Array.isArray(S.tasks)) S.tasks = [];
    if(!Array.isArray(S.logs)) S.logs = [];
    if(!Array.isArray(S.money)) S.money = [];
    if(!Array.isArray(S.trackers)) S.trackers = TRACK0();
    if(!Array.isArray(S.fixed)) S.fixed = FIX0();
    if(!Array.isArray(S.people)) S.people = PEOPLE0();
    // eski sürüm: Alışveriş'e ayrılmış kayıtları ürün listesine çevir
    S.items.filter(function(i){return i.heading==='alisveris'}).forEach(function(i){ addProducts(i.text); });
    S.items = S.items.filter(function(i){return i.heading!=='alisveris'});
    // alınanlar ertesi gün kendiliğinden temizlenir
    S.shop = S.shop.filter(function(x){ return !x.boughtAt || x.boughtAt===today(); });
  }

  // "Mali, süt ve 2 ekmek ekle" → ["Süt", "2 ekmek"]
  function splitProducts(text){
    var s = text.trim().replace(/^mali[,:]?\s*/i,'');
    s = s.replace(/\s+(listeye|alışveriş listesine|markete)?\s*(ekle|al|alınacak|lazım|bitti)[.!]?$/i,'');
    s = s.replace(/^(listeye|alışveriş listesine)\s+/i,'');
    return s.split(/\s*(?:,|;|\n|\sve\s|\sile\s|\s\+\s)\s*/i).map(function(x){return x.trim();}).filter(Boolean)
      .map(function(x){ return x.charAt(0).toLocaleUpperCase('tr')+x.slice(1); });
  }
  // "online listeye kulaklık ekle" → Online listesi; liste adı yoksa Ana liste
  function listOf(text){
    var low = ' '+text.toLocaleLowerCase('tr')+' ';
    for(var i=0;i<S.lists.length;i++){
      var nm = S.lists[i].name.toLocaleLowerCase('tr').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      var suf = nm.length>=5 ? "'?[ye]?[ae]" : "'[ye]?[ae]";   // kısa adlarda ek için kesme işareti şart ("eve" ≠ "Ev'e")
      var re = new RegExp("\\s"+nm+"(\\s+(alışveriş\\s+)?(listesine|listeye|listesi|listem)|"+suf+"\\s)");
      if(re.test(low)) return {id:S.lists[i].id, strip:new RegExp("(^|\\s)"+nm+"("+suf+"|\\s+(alışveriş\\s+)?(listesine|listeye|listesi|listem))(?=\\s|$)",'i')};
    }
    return null;
  }
  function shopOf(lid){ return S.shop.filter(function(x){ return (x.list||null)===(lid||null); }); }
  function addProducts(text, lid){
    var L = listOf(text);
    if(L){ lid = L.id; text = text.toLocaleLowerCase('tr').replace(L.strip,' ').replace(/\s+/g,' ').trim(); }
    var names = splitProducts(text);
    names.forEach(function(n,k){
      if(shopOf(lid).some(function(x){return !x.boughtAt && x.name.toLocaleLowerCase('tr')===n.toLocaleLowerCase('tr')})) return;
      var it = {id:'s'+Date.now()+'_'+k+'_'+Math.random().toString(36).slice(2,6),name:n,created:Date.now(),boughtAt:null};
      if(lid) it.list = lid;
      S.shop.push(it);
    });
    return names.length;
  }
  load(lsGet());
  if(LOCKED){
    var pv=null; try{ pv=JSON.parse(localStorage.getItem('hayat-state-prev')); }catch(e){}
    if(pv && pv.v===1 && confirm('Kayıtların okunamadı. Bir önceki kopya bulundu, geri yüklensin mi?\n(İptal dersen hiçbir şey silinmez, uygulama yeni kayıt yapmadan açılır.)')){ load(pv); save(); }
  }
  if(!S.lastBackup && !LOCKED) S.lastBackup = today();
  if(!Array.isArray(S.fixed)) S.fixed = FIX0();
  if(!Array.isArray(S.people)) S.people = PEOPLE0();
  if(!Array.isArray(S.lists)) S.lists = [{id:'online',name:'Online'}];
  if(!Array.isArray(S.trackers)){ S.trackers = TRACK0(); S.logs = S.logs||[]; S.money = S.money||[]; }


  // ---------- yardımcılar ----------
  function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function streak(days){
    var set = {}; days.forEach(function(d){ set[d]=1; });
    var n=0, d=new Date();
    if(!set[today()]) d.setDate(d.getDate()-1);
    while(true){
      var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(!set[k]) break; n++; d.setDate(d.getDate()-1);
    }
    return n;
  }
  function mark(arr){ var t=today(); if(arr.indexOf(t)<0) arr.push(t); }
  function el(tag, attrs, kids){
    var e=document.createElement(tag);
    if(attrs) for(var k in attrs){ if(k==='class') e.className=attrs[k]; else if(k==='text') e.textContent=attrs[k]; else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2), attrs[k]); else if(k==='style') e.setAttribute('style',attrs[k]); else e.setAttribute(k,attrs[k]); }
    (kids||[]).forEach(function(c){ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }
  function heading(id){ return S.headings.find(function(h){return h.id===id}); }
  // simge: <svg><use href="#i-..."></svg>
  function ic(n, cls){ var NS='http://www.w3.org/2000/svg', s=document.createElementNS(NS,'svg'), u=document.createElementNS(NS,'use');
    s.setAttribute('class',cls||'i'); s.setAttribute('aria-hidden','true'); u.setAttribute('href','#i-'+n); s.appendChild(u); return s; }
  var HICON={yapilacak:'tick',fikir:'bulb',onemli:'flag',planli:'clock',alisveris:'cart',ingilizce:'book',rutinler:'repeat',bos:'plus'};
  function hue(h){ return h && h.color ? '--hue:var('+h.color.replace('--r-','--c-')+')' : ''; }
  function hIco(h, cls){ var n=HICON[h.id]; return el('span',{class:cls||'ico',style:hue(h)},[n ? ic(n) : (h.icon||h.name.charAt(0))]); }
  function hCount(h){
    var n = h.id==='alisveris' ? S.shop.filter(function(x){return !x.boughtAt}).length : S.items.filter(function(i){return i.heading===h.id && !i.done}).length;
    if(h.id==='yapilacak') n += S.tasks.filter(function(t){return !t.doneAt}).length;
    return n;
  }
  // Türkçe yönelme eki: Yapılacak'a, Fikir'e, Önemli'ye, Planlı'ya
  function dative(w){ var v=(w.toLocaleLowerCase('tr').match(/[aıoueiöü]/g)||['e']).pop(), back=/[aıou]/.test(v), end=/[aıoueiöü]$/i.test(w);
    return w+"'"+(end?'y':'')+(back?'a':'e'); }
  function buzz(){ try{ navigator.vibrate && navigator.vibrate(30); }catch(e){} }
  var tt;
  function award(n, msg){
    S.points += n; logPts(n); buzz();
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastPts').textContent = '+' + n;
    var t=document.getElementById('toast'); t.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('show')},1600);
    var p=document.getElementById('pts'); if(p){ p.classList.add('pop'); setTimeout(function(){p.classList.remove('pop')},250); }
  }
  function logPts(n){ if(!S.daily) S.daily={}; var k=today(); S.daily[k]=Math.max(0,(S.daily[k]||0)+n); }
  function unaward(n){ S.points=Math.max(0,S.points-n); logPts(-n); buzz(); }
  // ---------- Mali tarih/saat anlama ----------
  // "pazartesi saat 10'da dişçiyi ara" → {title:"Dişçiyi ara", date:"2026-10-05", time:"10:00"}
  var GUNLER = ['pazar','pazartesi','salı','çarşamba','perşembe','cuma','cumartesi'];
  var AYLAR = ['ocak','şubat','mart','nisan','mayıs','haziran','temmuz','ağustos','eylül','ekim','kasım','aralık'];
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function parseWhen(text, now){
    now = now || new Date();
    var o = ' ' + text.replace(/[’`]/g,"'") + ' ', s = o.toLocaleLowerCase('tr');
    if(s.length !== o.length) s = o.toLowerCase();
    var base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var date = null, time = null;
    function take(re, fn){ var m = s.match(re); if(m){ fn(m); var i = m.index, sp = ' '.repeat(m[0].length);
      s = s.slice(0,i) + sp + s.slice(i+m[0].length); o = o.slice(0,i) + sp + o.slice(i+m[0].length); return true; } return false; }
    function add(n){ var d=new Date(base); d.setDate(d.getDate()+n); return d; }
    var SUF = "(?:'?(?:d[ae]|t[ae]|ye|ya|e|a|den|dan|ten|tan|ki|kü|nde|nda))?";
    // tarih
    take(new RegExp("\\s(\\d{1,2})\\s+("+AYLAR.join('|')+")"+SUF+"(?:\\s+(\\d{4}))?(?=[\\s,.!?])"), function(m){
      var y = m[3] ? +m[3] : base.getFullYear(), d = new Date(y, AYLAR.indexOf(m[2]), +m[1]);
      if(!m[3] && d < base) d.setFullYear(y+1); date = d; })
    || take(new RegExp("\\s(\\d{1,2})[./](\\d{1,2})(?:[./](\\d{2,4}))?"+SUF+"(?=[\\s,.!?])"), function(m){
      var y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : base.getFullYear(), d = new Date(y, +m[2]-1, +m[1]);
      if(!m[3] && d < base) d.setFullYear(y+1); date = d; })
    || take(new RegExp("\\shaftaya\\s+("+GUNLER.slice().sort(function(a,b){return b.length-a.length}).join('|')+")"+SUF+"(?=[\\s,.!?])"), function(m){
      var wd = GUNLER.indexOf(m[1]), mon = add(-((base.getDay()+6)%7) + 7); // gelecek haftanın pazartesisi
      var d = new Date(mon); d.setDate(d.getDate() + (wd+6)%7); date = d; })
    || take(/\s(?:gelecek|önümüzdeki)\s+hafta(?:ya)?\s/, function(){ date = add(7 - ((base.getDay()+6)%7)); })
    || take(/\shaftaya\s/, function(){ date = add(7); })
    || take(/\s(\d{1,2})\s+gün\s+sonra(?:ki)?\s/, function(m){ date = add(+m[1]); })
    || take(/\s(?:öbür\s*gün|ertesi\s*gün|yarından\s+sonra)\s/, function(){ date = add(2); })
    || take(/\syarın(?:ki|a)?\s/, function(){ date = add(1); })
    || take(/\sbugün(?:kü|e)?\s/, function(){ date = add(0); })
    || take(/\sbu\s+akşam\s/, function(){ date = add(0); time = '19:00'; })
    || take(new RegExp("\\s("+GUNLER.slice().sort(function(a,b){return b.length-a.length}).join('|')+")"+SUF+"(?:\\s+günü)?(?=[\\s,.!?])"), function(m){
      var wd = GUNLER.indexOf(m[1]), diff = (wd - base.getDay() + 7) % 7; date = add(diff); });
    // saat
    var part = null;
    take(/\s(sabah|öğle(?:n|den sonra)?|öğleden\s+sonra|akşam|gece)\s/, function(m){ part = m[1]; });
    var hm = null;
    take(new RegExp("\\s(?:saat\\s+)?(\\d{1,2})[:.](\\d{2})"+SUF+"(?=[\\s,.!?])"), function(m){ hm=[+m[1],+m[2]]; })
    || take(new RegExp("\\ssaat\\s+(\\d{1,2})"+SUF+"(?=[\\s,.!?])"), function(m){ hm=[+m[1],0]; })
    || (part && take(new RegExp("\\s(\\d{1,2})"+SUF+"(?=[\\s,.!?])"), function(m){ hm=[+m[1],0]; }))
    || take(/\s(\d{1,2})'?(?:d[ae]|t[ae])\s/, function(m){ hm=[+m[1],0]; });
    if(hm && hm[0] <= 24 && hm[1] < 60){
      var h = hm[0];
      if(part && /öğle|akşam|gece/.test(part) && h < 12) h += 12;
      if(part==='gece' && h===24) h = 0;
      if(!part && h >= 1 && h <= 6) h += 12;   // "saat 3'te" büyük ihtimalle öğleden sonra
      time = String(h%24).padStart(2,'0')+':'+String(hm[1]).padStart(2,'0');
    } else if(part && !time){
      time = {sabah:'09:00', 'öğlen':'12:00', 'öğle':'12:00', akşam:'19:00', gece:'22:00'}[part] || (/sonra/.test(part) ? '15:00' : null);
    }
    if(!date && time){ date = new Date(base); if(time <= String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')) date.setDate(date.getDate()+1); }
    if(!date) return null;
    var title = o.replace(/^\s*mali[,:]?\s*/i,' ').replace(/\s(hatırlat|hatırla|unutmayayım|unutma|beni uyar)[.!]?\s*$/i,' ')
      .replace(/\s+[,.]/g,' ').replace(/\s{2,}/g,' ').trim().replace(/^[,.\s]+|[,.\s]+$/g,'');
    if(!title) title = text.trim();
    title = title.charAt(0).toLocaleUpperCase('tr') + title.slice(1);
    return {title:title, date:ymd(date), time:time};
  }

  // ---------- Yapılacaklar & takvim ----------
  var GUN_KISA = ['Pz','Pt','Sa','Ça','Pe','Cu','Ct'];
  var GUN_UZUN = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  var AY_UZUN = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  function dOf(k){ var p=k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function nowHM(){ var n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
  function whenLabel(t){
    var d=dOf(t.date), diff=Math.round((d-dOf(today()))/864e5);
    var day = diff===0?'Bugün':diff===1?'Yarın':diff===-1?'Dün':GUN_UZUN[d.getDay()]+' '+d.getDate()+' '+AY_UZUN[d.getMonth()];
    return day + (t.time?' '+t.time:'');
  }
  function isLate(t){ return !t.doneAt && (t.date < today() || (t.date===today() && t.time && t.time < nowHM())); }
  function byTime(a,b){ return (a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99')); }
  function tasksOn(k){ return S.tasks.filter(function(t){return t.date===k}).sort(byTime); }
  function addTask(w){
    var t={id:'t'+Date.now()+Math.random().toString(36).slice(2,5),title:w.title,date:w.date,time:w.time||null,created:Date.now(),doneAt:null};
    S.tasks.push(t); return t;
  }
  function toggleTask(t, isPriority){
    if(t.doneAt){ t.doneAt=null; unaward(10);
      if(t.parent){ var par=S.tasks.find(function(x){return x.id===t.parent}); if(par && par.doneAt){ par.doneAt=null; unaward(10); } } }
    else {
      t.doneAt=today(); mark(S.doneDays);
      if(t.parent){
        var par2=S.tasks.find(function(x){return x.id===t.parent});
        var sib=S.tasks.filter(function(x){return x.parent===t.parent});
        if(par2 && !par2.doneAt && sib.every(function(x){return x.doneAt})){ par2.doneAt=today(); award(30,'Büyük iş bitti 🎉'); save(); render(); return; }
      }
      var pr=priorities(), all=isPriority && pr.length===3 && pr.every(function(x){return x.t ? x.t.doneAt : x.i.done;});
      all ? award(40,'3 öncelik bitti, harika gün') : award(10,'Tamamlandı');
    }
    save(); render();
  }
  // uzun basma = düzenle, kısa dokunma = bitti
  function pressable(node, onTap, onLong){
    var timer=null, long=false;
    node.addEventListener('pointerdown',function(){ long=false; timer=setTimeout(function(){ long=true; buzz(); onLong(); },550); });
    ['pointerup','pointerleave','pointercancel'].forEach(function(e){ node.addEventListener(e,function(){ clearTimeout(timer); }); });
    node.addEventListener('contextmenu',function(e){ e.preventDefault(); });
    node.addEventListener('click',function(){ if(!long) onTap(); });
    return node;
  }
  function taskRow(t, opts){
    opts = opts || {};
    var late = isLate(t);
    var more = el('span',{class:'more','aria-label':'Seçenekler'},[ic('dots')]);
    var row = el('button',{class:'row task'+(t.doneAt?' done':'')+(late?' late':''),type:'button'},[
      el('span',{class:'box'}),
      el('span',{class:'tx'},[el('span',{class:'t',text:(t.parent?'↳ ':'')+t.title}),
        el('small',{text: (late ? 'Geçti · '+whenLabel(t) : opts.full ? whenLabel(t) : (t.time||'')) + stepCount(t) + (t.gcal?' · takvimde':'')})]), more]);
    if(t.parent) row.classList.add('step');
    function open(){ view={name:'task',id:t.id,back:view}; render(); }
    more.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
    more.addEventListener('click',function(e){ e.stopPropagation(); open(); });
    return pressable(row, function(){ toggleTask(t, opts.priority); }, open);
  }
  function stepCount(t){ var st=S.tasks.filter(function(x){return x.parent===t.id}); return st.length ? ' · '+st.filter(function(x){return x.doneAt}).length+'/'+st.length+' adım' : ''; }
  // Google Takvim: sen dokununca açılır, termini kendi takvimine kaydedersin
  function gcalUrl(t){
    var d=t.date.replace(/-/g,''), dates;
    if(t.time){ var st=dOf(t.date); var hm=t.time.split(':'); st.setHours(+hm[0],+hm[1]); var en=new Date(st.getTime()+30*6e4);
      function f(x){ return ymd(x).replace(/-/g,'')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00'; }
      dates=f(st)+'/'+f(en); }
    else { var nx=dOf(t.date); nx.setDate(nx.getDate()+1); dates=d+'/'+ymd(nx).replace(/-/g,''); }
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&dates='+dates+'&ctz=Europe%2FBerlin&details='+encodeURIComponent('Hayat\'tan eklendi · https://malitamam.github.io/Hayat/');
  }
  function priorities(){
    var t = today();
    var list = S.tasks.filter(function(x){ return x.date===t && (!x.doneAt || x.doneAt===t); }).sort(byTime).map(function(x){return {t:x};});
    S.items.filter(function(i){ return (i.heading==='yapilacak'||i.heading==='onemli'||i.heading==='planli') && (!i.done || i.doneAt===t); })
      .forEach(function(i){ list.push({i:i}); });
    return list.slice(0,3);
  }

  function renderTodo(){
    var mode = view.mode || 'hafta', anchor = view.anchor || today(), sel = view.sel || today();
    app.append(el('h2',{text:'Yapılacaklar'}));
    var f = el('form',{class:'shopadd',autocomplete:'off'},[
      el('input',{type:'text',id:'todoIn',placeholder:"yarın 10'da dişçiyi ara",'aria-label':'Yapılacak ekle'}),
      el('button',{type:'submit',text:'Ekle'})]);
    f.addEventListener('submit',function(e){
      e.preventDefault(); var v=document.getElementById('todoIn').value.trim(); if(!v) return;
      var w=parseWhen(v);
      if(w){ var nt=addTask(w); view.anchor=nt.date; view.sel=nt.date; flash('Takvime eklendi', whenLabel(nt)); }

          var hv=new DataView(h); en.off=en.lo+30+hv.getUint16(26,true)+hv.getUint16(28,true); return en; }); }));
      }).then(function(ents){
        var by={}; ents.forEach(function(en){ by[en.name]=en; });

    for(var i=0;i<7;i++){ (function(d){
      var k = ymd(d), n = S.tasks.filter(function(t){return t.date===k && !t.parent}).length, dots = el('span',{class:'dots'});
      for(var j=0;j<Math.min(n,3);j++) dots.append(el('span'));
      strip.append(el('button',{class:'wcell'+(k===sel?' sel':'')+(k===t0?' today':'')+(k<t0?' past':''),type:'button',

    if(lid) app.append(el('button',{class:'textlink',type:'button',text:'Bu listeyi sil',onclick:function(){
      var l=S.lists.filter(function(x){return x.id===lid})[0]; if(!confirm('"'+l.name+'" listesi'+(cur.length?' ve içindeki '+cur.length+' ürün':'')+' silinsin mi?')) return;
      S.lists=S.lists.filter(function(x){return x.id!==lid}); S.shop=S.shop.filter(function(x){return x.list!==lid}); view.list=null; save(); render(true); }}));
  }

  function renderAdd(){
    var type='category', colors=['--r-task','--r-note','--r-en','--r-plan','--r-shop','--r-rt'];
    var used = S.headings.filter(function(h){return !h.empty}).length, color=colors[used%colors.length];
    app.append(el('button',{class:'back',type:'button',onclick:function(){view={name:'rooms'};render();}},[ic('left'),'Vazgeç']), el('h2',{text:'Yeni oda ya da klasör'}));
    var name = el('input',{id:'newName',type:'text',placeholder:'ör. Sağlık',maxlength:'24'});
    var bCat = el('button',{type:'button',class:'on'},[el('b',{text:'Klasör'}), el('small',{text:'İçine yapılacak, not, fikir atarsın. Havuzda klasör olur.'})]);
    var bRoom = el('button',{type:'button'},[el('b',{text:'Oda'}), el('small',{text:'Kendi dünyası olan mini uygulama. İçini birlikte kurarız.'})]);
    bCat.onclick=function(){type='category';bCat.classList.add('on');bRoom.classList.remove('on');};
    bRoom.onclick=function(){type='room';bRoom.classList.add('on');bCat.classList.remove('on');};
    var sw=el('div',{class:'sw'});
    var NAMES={'--r-task':'Sarı','--r-note':'Mor','--r-en':'Kırmızı','--r-plan':'Lila','--r-shop':'Mavi','--r-rt':'Yeşil'};
    colors.forEach(function(c){ var b=el('button',{type:'button',class:c===color?'on':'',style:'--hue:var('+c.replace('--r-','--c-')+')','aria-label':NAMES[c]});
      b.onclick=function(){ color=c; sw.querySelectorAll('button').forEach(function(x){x.classList.remove('on')}); b.classList.add('on'); }; sw.append(b); });
    var form = el('form',{class:'form'},[el('label',{for:'newName',text:'Adı'}), name, el('label',{text:'Ne olsun?'}), el('div',{class:'types'},[bCat,bRoom]),
      el('label',{text:'Rengi'}), sw, el('button',{class:'primary',type:'submit',text:'Kaydet'})]);
    form.addEventListener('submit',function(e){
      e.preventDefault(); var n=name.value.trim(); if(!n){ name.focus(); return; }
      S.headings.splice(S.headings.length-1,0,{id:'h'+Date.now(),name:n,type:type,color:color,icon:n.charAt(0).toLocaleUpperCase('tr')});
      save(); view={name:'home'}; render();
    });
    app.append(form);
    setTimeout(function(){name.focus()},50);
  }

  // ---------- Mali kartı: ortadaki tuş = dinle, basılı tut = yaz ----------
  var stopMic=function(){};
  var sheet=document.getElementById('maliSheet'), SAVENOTE=document.getElementById('saveNote').textContent;
  function openMali(listen){
    sheet.hidden=false; var m=document.getElementById('mic');
    if(listen && !m.hidden) m.click(); else setTimeout(function(){ document.getElementById('maliInput').focus(); },60);
  }
  function closeMali(){ stopMic(); sheet.hidden=true; askAmt=null; document.getElementById('maliTitle').textContent="Mali'ye söyle"; document.getElementById('maliInput').placeholder="yarın 10'da dişçiyi ara"; document.getElementById('saveNote').textContent=SAVENOTE; }
  pressable(document.getElementById('maliBtn'), function(){ buzz(); openMali(true); }, function(){ openMali(false); });
  document.getElementById('maliDim').addEventListener('click', closeMali);
  document.getElementById('maliClose').addEventListener('click', closeMali);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !sheet.hidden) closeMali(); });
  document.getElementById('maliForm').addEventListener('submit',function(e){
    e.preventDefault();
    var inp=document.getElementById('maliInput'), t=inp.value.trim(); if(!t) return;
    if(/(geçen|bu)\s+hafta(\s+neler)?\s+ne\s+yap|hafta\s+raporu|haftalık\s+rapor/.test(t.toLocaleLowerCase('tr'))){ closeMali(); inp.value=''; view={name:'report', wk: /^\s*bu/.test(t.toLocaleLowerCase('tr')) ? ymd(weekStart()) : null}; render(); return; }
    var ask = askAmt;
    if(ask){
      var amt = parseAmount(t); closeMali(); inp.value='';
      if(amt && ask.fx){ payFixed(ask.fx, amt, ask.date); award(5, ask.fx.name+' ödendi · '+money(amt)); save(); render(); }
      else if(amt){ ask.lg.amount = amt; S.money.push({id:uid('m'),type:'gider',amount:amt,cur:'€',cat:ask.t.cat||'Diğer',note:ask.t.name,date:ask.lg.date,created:Date.now()});
        award(2, ask.t.name+' gideri '+money(amt)); save(); render(); }
      else flash('Tutarı anlayamadım','Para sayfasından ekleyebilirsin');
      return;
    }
    var L=parseLife(t);
    closeMali();
    if(L){ var said=addLife(L,t); inp.value=''; if(/zaten ödenmişti/.test(said) && !/ödendi ·/.test(said) && !L.made.length) flash(said); else if(said) award(L.fx&&L.fx.length&&/ödendi ·/.test(said)?5:2, said); save(); render();
      if(L.askFx){ setTimeout(function(){ askAmt={t:L.askFx,lg:null,fx:L.askFx,date:L.date}; askForAmount(L.askFx, null, true); }, 700); }
      var need = !L.mo && !L.askFx && L.made.filter(function(x){ return x[0].id==='benzin' || x[0].id==='yikama'; })[0];
      if(need) setTimeout(function(){ askForAmount(need[0], need[1]); }, 700);
      return; }
    var w=parseWhen(t);
    if(w){ var nt=addTask(w); mark(S.activeDays); inp.value=''; save(); flash('Takvime eklendi · '+nt.title, whenLabel(nt)); render(); return; }
    S.items.push({id:'i'+Date.now(),text:t,created:Date.now(),heading:null,suggested:suggest(t),done:false,doneAt:null});
    mark(S.activeDays); inp.value=''; save();
    var n=S.items.filter(function(i){return !i.heading}).length;
    document.getElementById('toastMsg').textContent='Havuza eklendi'; document.getElementById('toastPts').textContent=n+' bekliyor';
    var t2=document.getElementById('toast'); t2.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){t2.classList.remove('show')},1400);
    buzz(); render();
  });

  document.getElementById('restore').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    f.text().then(function(t){
      try{ var o=JSON.parse(t); if(!o||o.v!==1||!Array.isArray(o.items)) throw 0;
        if(!confirm('Yedek yüklensin mi? Telefondaki kayıtların yerine geçer.')) return;
        load(o); save(); view={name:'home'}; render(); }
      catch(x){ alert('Bu dosya Hayat yedeği değil.'); }
      e.target.value='';
    });
  });

  // ---------- sesle söyle (Chrome) ----------
  // Sen susunca 3 sn bekler, sonra kaydeder. İstersen 🎤'ye tekrar basıp hemen bitirirsin.
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    var mic=document.getElementById('mic'), inp=document.getElementById('maliInput'), hint=document.getElementById('saveNote');
    var MIC='<svg><use href="#i-mic"/></svg>', STOP='<svg><use href="#i-stop"/></svg>';
    var hintText=hint.textContent, rec=null, listening=false, kept='', sess='', interim='', quiet=null, hardStop=null, startedAt=0;
    var SILENCE=3000, FIRST_WAIT=7000, MAX=45000;
    mic.hidden=false;
    function lc(x){ return x.toLocaleLowerCase('tr'); }
    function joined(){ return (kept+' '+sess+' '+interim).replace(/\s+/g,' ').trim(); }
    function arm(ms){ clearTimeout(quiet); quiet=setTimeout(function(){ finish(); }, ms); }
    function begin(){
      rec=new SR(); rec.lang='tr-TR'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
      sess=''; interim='';
      rec.onresult=function(ev){
        interim='';
        for(var i=ev.resultIndex;i<ev.results.length;i++){
          var t=ev.results[i][0].transcript.trim(); if(!t) continue;
          if(ev.results[i].isFinal){
            // Android bazen aynı cümleyi büyüyerek tekrar gönderir: tekrarı ekleme
            if(sess && lc(t).indexOf(lc(sess))===0) sess=t;
            else if(!sess || lc(sess).slice(-lc(t).length)!==lc(t)) sess=(sess+' '+t).trim();
          } else interim+=' '+t;
        }
        inp.value=joined(); arm(SILENCE);
      };
      rec.onerror=function(e){ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ listening=false; hint.textContent='Mikrofon izni yok. Chrome ayarlarından izin ver.'; } };
      rec.onend=function(){
        // telefon kendi kendine durdurduysa ve süre dolmadıysa dinlemeye devam et
        kept=(kept+' '+sess+' '+interim).trim(); sess=''; interim='';
        if(listening && Date.now()-startedAt<MAX){ try{ begin(); return; }catch(x){} }
        if(listening) finish();
      };
      rec.start();
    }
    function finish(){
      if(!listening) return;
      listening=false; clearTimeout(quiet); clearTimeout(hardStop);
      var text=joined(); kept=''; sess=''; interim='';
      try{ rec && rec.stop(); }catch(x){}
      mic.classList.remove('on'); mic.innerHTML=MIC; hint.textContent=hintText;
      inp.value=text;
      if(text) document.getElementById('maliForm').requestSubmit();
    }
    mic.addEventListener('click',function(){
      if(listening){ finish(); return; }
      listening=true; kept=''; startedAt=Date.now(); inp.value='';
      mic.classList.add('on'); mic.innerHTML=STOP;
      hint.textContent='Dinliyorum… Sustuğunda 3 saniye sonra kaydederim. Hemen bitirmek için sarı tuşa bas.';
      arm(FIRST_WAIT); hardStop=setTimeout(finish, MAX);
      try{ begin(); }catch(x){ finish(); }
    });
    stopMic=function(){ if(!listening) return; listening=false; clearTimeout(quiet); clearTimeout(hardStop); kept=''; sess=''; interim='';
      try{ rec && rec.abort(); }catch(x){} mic.classList.remove('on'); mic.innerHTML=MIC; hint.textContent=hintText; };
  }

  if(location.hash==='#pazar'){ view={name:'review'}; history.replaceState(null,'',location.pathname); }
  render();
})();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
